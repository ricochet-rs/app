[package]
name = "ricochet-app"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
dirs = "7.0.0"
flate2 = "1.1.11"
futures = "0.3.34"
gpui = { version = "0.2.2", features = ["runtime_shaders"] }
gpui-component = "0.5.1"
gpui-component-assets = "0.5.1"
libc = "0.2.191"
open = "5.4.5"
rust-embed = "8"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
socket2 = "0.6.5"
tar = "0.4.46"
thiserror = "2.0.21"
toml_edit = "0.25.19"
trash = "5.3.0"
ureq = "3.5.1"

[dev-dependencies]
tempfile = "3.27.0"

[target.'cfg(target_os = "macos")'.dependencies]
plist = "1.10.3"
