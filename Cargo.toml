[package]
name = "ricochet-app"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
dirs = "7.0.0"
flate2 = "1.1.11"
futures = "0.3.34"
gpui = { package = "gpui-pre", version = "=0.3.14" }
gpui-component = "0.11.0"
gpui-kit-assets = "0.11.0"
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.14", features = ["font-kit", "runtime_shaders", "wayland", "x11"] }
# The server's web UI runs in the system's webview: WKWebView on macOS, WebView2 on Windows and WebKitGTK on Linux.
gpui-webview = "0.11.0"
wry = { package = "lb-wry", version = "0.53.3", default-features = false }
# GPUI's HTTP client pulls in xattr 0.2.3, which reads libc::ENOATTR on Linux, and libc 0.2.190 removed it.
libc = ">=0.2.182, <0.2.190"
open = "5.4.5"
rust-embed = "8"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
socket2 = "0.6.5"
tar = "0.4.46"
thiserror = "2.0.21"
toml_edit = "0.25.19"
trash = "5.3.0"
ureq = "3.5.1"
zip = { version = "9.4.1", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3.27.0"

[target.'cfg(target_os = "macos")'.dependencies]
plist = "1.10.3"
# wry's proxy for WKWebView, which needs macOS 14; the app needs macOS 15 already.
wry = { package = "lb-wry", version = "0.53.3", default-features = false, features = ["mac-proxy"] }

# WebKitGTK draws the web UI on Linux; wry embeds it only in an X11 window, so the app runs on X11 there.
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

# GPUI precompiles its Windows shaders with fxc.exe only when it builds on Windows, so the cross-compiled
# Windows build keeps the debug assertions of gpui-pre-windows on, which makes it compile those shaders at run time.
[profile.windows]
inherits = "release"

[profile.windows.package.gpui-pre-windows]
debug-assertions = true
