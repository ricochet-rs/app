# Builds the Apple Silicon .dmg on GitHub, because Crow's Mac agent sandboxes each step and hdiutil can't attach a disk image there.
name: mac

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: The tag to build and attach the .dmg to
        required: true

permissions:
  contents: write

concurrency:
  group: mac-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: true

jobs:
  dmg:
    runs-on: macos-15
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - uses: Swatinem/rust-cache@v2
      - name: Build the .dmg
        run: just dmg "${TAG#v}"
      - name: Attach the .dmg to the release
        run: |
          # Crow's release.yaml publishes the release, so wait for it when this build finishes first.
          for _ in $(seq 60); do
            gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1 && break
            sleep 15
          done
          gh release upload "$TAG" "dist/ricochet-${TAG#v}.dmg" --repo "$GITHUB_REPOSITORY" --clobber
