# Cross-compiles the Windows app on the Linux agent with cargo-xwin, zips it with renv, and attaches it to the release from release.yaml.
clone:
  git:
    image: codefloe.com/crow-plugins/clone:1.2.2
    settings:
      tags: true

when:
  - event: tag

depends_on:
  - release

labels:
  agent: thumper

steps:
  'Build the Windows zip':
    image: reg.ricochet.rs/docker.io/library/rust:1-bookworm
    commands:
      - apt-get update -qq
      - apt-get install -y -qq --no-install-recommends clang lld llvm zip curl
      - rustup target add x86_64-pc-windows-msvc
      - cargo install cargo-xwin --locked
      - curl -fsSL https://just.systems/install.sh | bash -s -- --tag 1.43.0 --to /usr/local/bin
      - |
        set -euo pipefail
        VERSION="${CI_COMMIT_TAG#v}"
        just windows "$VERSION"

  'Attach the Windows zip':
    image: reg.ricochet.rs/docker.io/library/alpine:3.24
    depends_on:
      - 'Build the Windows zip'
    environment:
      GITHUB_TOKEN:
        from_secret: ricochet_issue_token
    commands:
      - apk add -q --no-cache github-cli
      - |
        set -euo pipefail
        VERSION="${CI_COMMIT_TAG#v}"
        # --clobber replaces the asset a previous run of this tag uploaded.
        gh release upload "$CI_COMMIT_TAG" "dist/ricochet-$VERSION-windows-x86_64.zip" --repo "${CI_REPO}" --clobber
